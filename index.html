<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>⚔️ Guerra dos Reinos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header" role="banner">
    <div class="header-title">⚔️ Guerra dos Reinos ⚔️</div>
    <div class="header-sub">Temporada 2026 · Rodada <span id="current-round" aria-live="polite">—</span> de 38</div>
</header>

<main class="content" role="main">

    <!-- TAB: RANKING -->
    <div id="tab-ranking"
         class="tab-content active"
         role="tabpanel"
         aria-labelledby="nav-ranking"
         aria-hidden="false">
        <h2 class="section-title">🏆 Classificação Geral</h2>
        <div id="ranking-list" aria-live="polite"></div>
    </div>

    <!-- TAB: ALIANÇAS -->
    <div id="tab-aliancas"
         class="tab-content"
         role="tabpanel"
         aria-labelledby="nav-aliancas"
         aria-hidden="true">
        <h2 class="section-title">🤝 Batalha das Alianças</h2>
        <div id="aliancas-content"></div>
    </div>

    <!-- TAB: MEDIEVAL -->
    <div id="tab-medieval"
         class="tab-content"
         role="tabpanel"
         aria-labelledby="nav-medieval"
         aria-hidden="true">
        <h2 class="section-title">⚔️ Pontos Medievais</h2>
        <div id="medieval-list"></div>
    </div>

    <!-- TAB: BATALHAS -->
    <div id="tab-battles"
         class="tab-content"
         role="tabpanel"
         aria-labelledby="nav-battles"
         aria-hidden="true">
        <h2 class="section-title">🛡️ Histórico de Batalhas</h2>
        <div id="battles-list"></div>
    </div>

    <!-- TAB: TÍTULOS -->
    <div id="tab-achievements"
         class="tab-content"
         role="tabpanel"
         aria-labelledby="nav-achievements"
         aria-hidden="true">
        <h2 class="section-title">🏅 Hall da Fama</h2>
        <div id="achievements-list"></div>
    </div>

    <!-- TAB: REGRAS -->
    <div id="tab-rules"
         class="tab-content"
         role="tabpanel"
         aria-labelledby="nav-rules"
         aria-hidden="true">
        <h2 class="section-title">📜 Regras do Reino</h2>
        <div id="rules-content"></div>
    </div>

    <footer class="footer" role="contentinfo">
        <div class="footer-quote">"A glória não se mede apenas em pontos, mas em conquistas eternas!"</div>
        <div class="footer-info">Sistema de Conquistas Medievais v3.3 · 2026</div>
    </footer>
</main>

<!-- NAV -->
<nav class="bottom-nav" role="tablist" aria-label="Navegação principal">
    <button id="nav-ranking"
            class="nav-btn active"
            role="tab"
            aria-selected="true"
            aria-controls="tab-ranking"
            onclick="switchTab('ranking', this)">
        <span class="nav-icon" aria-hidden="true">🏆</span>
        <span>Ranking</span>
    </button>
    <button id="nav-aliancas"
            class="nav-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-aliancas"
            onclick="switchTab('aliancas', this)">
        <span class="nav-icon" aria-hidden="true">🤝</span>
        <span>Alianças</span>
    </button>
    <button id="nav-medieval"
            class="nav-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-medieval"
            onclick="switchTab('medieval', this)">
        <span class="nav-icon" aria-hidden="true">⚔️</span>
        <span>Medieval</span>
    </button>
    <button id="nav-battles"
            class="nav-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-battles"
            onclick="switchTab('battles', this)">
        <span class="nav-icon" aria-hidden="true">🛡️</span>
        <span>Batalhas</span>
    </button>
    <button id="nav-achievements"
            class="nav-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-achievements"
            onclick="switchTab('achievements', this)">
        <span class="nav-icon" aria-hidden="true">🏅</span>
        <span>Títulos</span>
    </button>
    <button id="nav-rules"
            class="nav-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-rules"
            onclick="switchTab('rules', this)">
        <span class="nav-icon" aria-hidden="true">📜</span>
        <span>Regras</span>
    </button>
</nav>

<script src="app.js"></script>
</body>
</html>
